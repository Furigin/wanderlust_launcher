# Пропатчена вложенная библиотека Registrate (META-INF/jarjar/Registrate-MC1.21-1.3.0+67.jar).
# Оригинал ронял клиент при открытии креативного инвентаря:
#   IllegalArgumentException: Itemstack 1 tfmg:cooling_fluid_bottle
#   already exists in the tab's list
# CreativeModeTabModifier.accept(ItemStack, TabVisibility) обёрнут в try/catch,
# поэтому повторное добавление одного и того же предмета во вкладку теперь
# молча игнорируется вместо краша. Больше в Create ничего не изменено.
# При обновлении Create патч надо накатить заново (scripts/patch_registrate.py).

