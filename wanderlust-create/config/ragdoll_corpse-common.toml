[corpses]
	#Whether players with no stored death drops should still leave a ragdoll corpse.
	# false: смерть без вещей больше не оставляет труп. Такой труп всё равно
	# нечего забирать, а физическое тело он создаёт наравне с остальными.
	spawnEmptyInventoryCorpses = false
	#How long normal corpses remain before despawning, in minutes. Set to 0 to keep them forever.
	# Default: 0.0
	# Range: 0.0 ~ 10080.0
	# Было 0.0 — то есть «хранить вечно», и трупы копились в мире без предела,
	# ровно как рэгдоллы с выключенным despawn. 30 минут: игрок успевает
	# вернуться за вещами, но мир не растёт бесконечно.
	corpseLifetimeMinutes = 30.0
	#How long an emptied corpse waits before despawning, in seconds.
	# Default: 1.5
	# Range: 0.0 ~ 600.0
	emptyCorpseDespawnSeconds = 1.5
