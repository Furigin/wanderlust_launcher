modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/Furigin/wanderlust_launcher/issues"

[[mods]]
modId = "wlrestart"
version = "1.0.0"
displayName = "Wanderlust Restart"
authors = "furigin"
description = '''
Перезапускает сервер по расписанию. Перед перезапуском открывает голосование:
кнопки ЗА и ПРОТИВ прямо в чате. Если против набралось не меньше заданной доли
онлайна — перезапуск переносится.

Мод только гасит сервер. Поднять его обратно должна панель хостинга
(автозапуск) или скрипт-обёртка вокруг запуска.
'''

# Мод серверный, на клиенте не нужен и его отсутствие у игрока не мешает подключиться.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.wlrestart]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1,)"
    ordering = "NONE"
    side = "SERVER"

[[dependencies.wlrestart]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.22)"
    ordering = "NONE"
    side = "SERVER"
